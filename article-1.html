                <h1 class="article-headline">一隻貓咪學會了如何按門鈴</h1>
                <div class="article-meta">
                    <div class="byline"><strong>記者：</strong> 寵物通訊員 / <strong>編輯：</strong> 王小明</div>
                    <div class="dateline"><strong>發布時間：</strong> 民國114年11月10日 (2025年11月10日)</div>
                </div>

            <figure class="article-image">
                <img src="https://via.placeholder.com/800x450.png?text=聰明的貓咪" alt="貓咪按門鈴">
                <figcaption>圖為示意圖，非當事貓。</figcaption>
            </figure>
            <article class="article-body">
                <p>這隻聰明的貓咪在觀察主人數週後，終於掌握了這項新技能，只為了要求更多的零食。據主人表示，這隻名為「Momo」的貓咪，現在每天凌晨三點都會準時按門鈴叫醒全家人。</p>
                <p>主人表示：「我一開始以為是送報紙的，沒想到是牠。我現在有點後悔教牠了。」</p>
